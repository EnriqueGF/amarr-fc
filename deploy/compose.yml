services:
  amule:
    image: ngosang/amule@sha256:36fcea6560fa96e7740cb0eb96af15871bf6cb4c3c350aa51147e4f110e90e43
    container_name: amule
    restart: unless-stopped
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Europe/Madrid
      GUI_PWD: ${AMULE_PASSWORD}
      WEBUI_PWD: ${AMULE_WEB_PASSWORD}
      MOD_AUTO_RESTART_ENABLED: "true"
      MOD_AUTO_RESTART_CRON: "0 6 * * *"
      MOD_AUTO_SHARE_ENABLED: "false"
      MOD_FIX_KAD_GRAPH_ENABLED: "true"
    ports:
      - "4700:4700/tcp"
      - "4703:4703/udp"
      - "4672:4672/udp"
    expose:
      - "4712"
    volumes:
      - /srv/media/amule/config:/home/amule/.aMule
      - /mnt/media/amuleCompleted:/incoming
      - /mnt/media/amuleDownloading:/temp
    healthcheck:
      test: ["CMD-SHELL", "pgrep -x amuled >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 2g

  amarr-fc:
    build:
      context: ..
      dockerfile: Dockerfile
    image: amarr-fc:local
    container_name: amarr-fc
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "8080"
    volumes:
      - /srv/media/amarr-fc/config:/config
      - /mnt/media/amuleCompleted:/incoming
    depends_on:
      amule:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    mem_limit: 768m

networks:
  default:
    name: media_default
    external: true
